name: Model-CI-mlflow
on:
  push:
    branches: 
      - dev
  pull_request:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5.0.0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup CML (Continuous Machine Learning)
        uses: iterative/setup-cml@v2.0.1

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate with Google Cloud
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      # This 'dvc pull' step is still correct.
      # It will now pull *only* your data, since you removed the model from DVC.
      - name: Pull DVC data
        run: |
          dvc pull

      # --- KEY CHANGE 1 ---
      # Add the MLFLOW_TRACKING_URI secret so pytest can find your server.
      - name: Run Pytest and Generate Artifacts
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          pytest -v > test.txt

      # --- KEY CHANGE 2 ---
      # Update the report to publish the real artifact from your test script.
      - name: Create CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Model Sanity Check Report" > report.md
          echo "### Pytest Results" >> report.md
          echo "\`\`\`" >> report.md
          cat test.txt >> report.md
          echo "\`\`\`" >> report.md
          echo "### Model Evaluation (from MLflow Registry)" >> report.md
          
          # This publishes the plot saved by test_model.py
          cml-publish artifacts/confusion_matrix_mlflow.png --md >> report.md

          cml comment create report.md
