name: MLflow CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main
permissions:
    contents: write
    pull-requests: write

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
    
      - name: Setup CML (Continuous Machine Learning)
        uses: iterative/setup-cml@v2.0.1
        

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        
      - name: Google Cloud Authentication
        id: 'auth'
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
    
      - name: Pulling Data using DVC
        run: |
          dvc pull
      
      - name: Training Model
        run: |
          python3 train.py

      - name: Load Model from mlflow
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python3 ci_check.py

      - name: Run Tests
        run: |
          pytest -v &> output.txt 

      
      - name: Create cml report
        run: |
          echo "# CML Test & Evaluation Report" > report.md
          
          echo "## Pytest Sanity Check" >> report.md
          # Check if output.txt exists before trying to cat it
          if [ -f output.txt ]; then
            echo "\`\`\`" >> report.md
            cat output.txt >> report.md
            echo "\`\`\`" >> report.md
          else
            echo "Pytest output file (output.txt) not found." >> report.md
          fi
          
          ## Section 2: Evaluation Metrics Table
          cat metrics.md >> report.md
          
          # Post the entire report.md content as a comment
          cml comment create report.md
        
        
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
